<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Abitudini</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0f1420">
<style>
:root{
  --bg:#0f1420; --card:#171e2c; --card2:#1d2637; --text:#e8ecf4; --muted:#8b96ab;
  --accent:#2dd4bf; --accent2:#38bdf8; --danger:#f87171; --warn:#fbbf24; --ok:#4ade80;
  --border:#2a3346;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:90px;}
.app-shell{max-width:600px; margin:0 auto;}
header{position:sticky; top:0; z-index:20; background:rgba(15,20,32,.92); backdrop-filter:blur(8px); padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; max-width:600px; margin:0 auto;}
header h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.3px;}
header h1 span{color:var(--accent);}
.user-chip{display:flex; align-items:center; gap:7px; cursor:pointer; font-size:12px; color:var(--muted); background:var(--card2); border:1px solid var(--border); padding:6px 10px; border-radius:20px; max-width:60vw;}
.user-chip span.email{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.status-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--danger);}
.status-dot.online{background:var(--ok);}
main{padding:14px 14px 20px; max-width:600px; margin:0 auto;}
.tabbar{position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--border); z-index:30;}
.tabbar-inner{display:flex; max-width:600px; margin:0 auto; width:100%;}
.tabbar button{flex:1; background:none; border:none; color:var(--muted); padding:10px 0 8px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
.tabbar button.active{color:var(--accent);}
.tabbar svg{width:20px; height:20px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:12px;}
.habit-card{display:flex; flex-direction:column; gap:8px;}
.habit-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.habit-name{font-size:16px; font-weight:600;}
.habit-freq{font-size:12px; color:var(--muted); margin-top:2px;}
.chip{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--card2); border:1px solid var(--border); color:var(--muted); white-space:nowrap;}
.chip.ok{color:var(--ok); border-color:#1f6d4a;}
.chip.warn{color:var(--warn); border-color:#7a5b12;}
.chip.danger{color:var(--danger); border-color:#7a2020;}
.chip.streak{color:#fbbf24; border-color:#7a5b12; background:#241c0a;}
.progress-row{display:flex; align-items:center; gap:8px;}
.progress-bar{flex:1; height:8px; background:var(--card2); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:6px; transition:width .3s;}
.small{font-size:12px; color:var(--muted);}
.btn{background:var(--accent); color:#06231f; border:none; border-radius:12px; padding:10px 14px; font-weight:700; font-size:14px; cursor:pointer;}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--border);}
.btn.small{padding:7px 11px; font-size:12px; border-radius:10px;}
.btn.danger{background:#3a1a1a; color:var(--danger); border:1px solid #5a2323;}
.row{display:flex; gap:8px;}
.row.wrap{flex-wrap:wrap;}
.fab{position:fixed; bottom:78px; left:50%; transform:translateX(calc(300px - 74px)); width:56px; height:56px; border-radius:50%; background:var(--accent); color:#06231f; border:none; font-size:28px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(45,212,191,.4); z-index:25; cursor:pointer;}
@media (max-width:640px){ .fab{ left:auto; right:18px; transform:none; } }
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.modal-bg.center{align-items:center;}
.modal{background:var(--card); border-radius:20px 20px 0 0; padding:20px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto;}
.modal-bg.center .modal{border-radius:18px;}
.modal h2{margin:0 0 14px; font-size:17px;}
label{display:block; font-size:12px; color:var(--muted); margin:12px 0 5px;}
input,select{width:100%; background:var(--card2); border:1px solid var(--border); color:var(--text); padding:11px 12px; border-radius:10px; font-size:15px;}
input[type=number]{width:90px;}
.freq-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.modal-actions .btn{flex:1;}
.empty{text-align:center; padding:40px 20px; color:var(--muted);}
.empty svg{width:48px; height:48px; opacity:.4; margin-bottom:10px;}
.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1d2637; border:1px solid var(--border); color:var(--text); padding:12px 16px; border-radius:14px; display:flex; align-items:center; gap:14px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.4); font-size:14px; animation:slideup .2s ease;}
@keyframes slideup{from{transform:translate(-50%,20px); opacity:0} to{transform:translate(-50%,0); opacity:1}}
.toast button{background:none; border:none; color:var(--accent); font-weight:700; font-size:14px; cursor:pointer;}
.history-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
.history-item:last-child{border-bottom:none;}
.history-item .del{background:none; border:none; color:var(--danger); cursor:pointer; padding:4px;}
.chart-wrap{overflow-x:auto; padding-top:6px;}
.bars{display:flex; align-items:flex-end; gap:4px; height:80px; min-width:100%;}
.bar-col{display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; width:22px;}
.bar{width:14px; background:var(--card2); border-radius:3px 3px 0 0; min-height:2px;}
.bar.hit{background:linear-gradient(180deg,var(--accent2),var(--accent));}
.bar-label{font-size:9px; color:var(--muted); writing-mode:vertical-rl;}
.reminder-banner{background:linear-gradient(135deg,#1c2f3a,#17222f); border:1px solid #2a4a52; border-radius:16px; padding:14px; margin-bottom:14px;}
.reminder-banner h3{margin:0 0 8px; font-size:14px; color:var(--accent);}
.reminder-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.reminder-item:last-child{border-bottom:none;}
.section-title{font-size:13px; color:var(--muted); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.5px;}
.sort-row{display:flex; gap:6px; margin-bottom:12px; overflow-x:auto;}
.sort-btn{background:var(--card2); border:1px solid var(--border); color:var(--muted); font-size:12px; padding:7px 12px; border-radius:20px; white-space:nowrap; cursor:pointer;}
.sort-btn.active{color:var(--accent); border-color:var(--accent);}
.grip{cursor:grab; color:var(--muted); padding:4px 6px; touch-action:none;}
.grip svg{width:18px; height:18px;}
.habit-card.dragging{opacity:.4;}
.kebab{background:none; border:none; color:var(--muted); cursor:pointer; padding:4px 6px;}
.kebab svg{width:20px; height:20px;}
.motivation-card{background:linear-gradient(135deg,#241c0a,#1c1508); border:1px solid #4a3a12; border-radius:16px; padding:14px; margin-bottom:14px;}
.motivation-card h3{margin:0 0 6px; font-size:14px; color:var(--warn);}
.auth-screen{min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
.auth-screen h2{font-size:20px; margin-bottom:6px;}
.auth-screen .card{width:100%; max-width:340px; text-align:left;}
.menu-item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border); cursor:pointer; font-size:15px;}
.menu-item:last-child{border-bottom:none;}
.menu-item svg{width:20px; height:20px; color:var(--muted); flex-shrink:0;}
.menu-item.danger{color:var(--danger);}
.menu-item.danger svg{color:var(--danger);}
</style>

<body>

<header>
  <h1>Abit<span>udini</span></h1>
  <div class="user-chip" id="userChip" onclick="openMenu()">

<div id="authGate"></div>

<button class="fab" onclick="openHabitModal()">+</button>

<div class="tabbar"><div class="tabbar-inner">
  <button class="tab-btn active" data-tab="oggi" onclick="switchTab('oggi')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
/* ============ CONFIG ============
   Stesso progetto Supabase di CaliMat / PesoDigiuno. */
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ SCHEMA (SQL — esegui le ALTER se il progetto ha già le tabelle) ============
create table abit_abitudini (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users default auth.uid(),
  nome text not null,
  tipo text not null default 'checkbox',        -- checkbox | quantita
  unita text,                                   -- solo per tipo 'quantita', es. 'km','litri','minuti','kcal'
  target_volte numeric not null default 1,       -- n. volte (checkbox) oppure obiettivo quantità (quantita)
  target_periodo text not null default 'giorno', -- giorno | settimana | mese | anno
  ordine int not null default 0,
  colore text default '#2dd4bf',
  archiviata boolean default false,
  created_at timestamptz default now()
);
create table abit_abitudini_log (
  id uuid primary key default gen_random_uuid(),
  habit_id uuid references abit_abitudini(id) on delete cascade,
  user_id uuid references auth.users default auth.uid(),
  fatto_at timestamptz not null default now(),
  valore numeric,                                -- solo per tipo 'quantita'
  nota text,
  created_at timestamptz default now()
);
alter table abit_abitudini enable row level security;
alter table abit_abitudini_log enable row level security;
create policy "own rows" on abit_abitudini for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "own rows" on abit_abitudini_log for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

-- Se le tabelle esistono già senza queste colonne:
-- alter table abit_abitudini add column if not exists tipo text not null default 'checkbox';
-- alter table abit_abitudini add column if not exists unita text;
-- alter table abit_abitudini_log add column if not exists valore numeric;
=========================================================================== */

const PERIOD_LABEL = {giorno:'giorno', settimana:'settimana', mese:'mese', anno:'anno'};
const PENDING_KEY = 'ab_pending_sync';

let state = {
  habits: [],
  logs: {},
  tab: 'oggi',
  sortMode: localStorage.getItem('ab_sort') || 'personale',
  online: navigator.onLine,
  session: null,
  dayStartHour: parseInt(localStorage.getItem('ab_day_start_hour') || '0'),
};

function uid(){ return crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+Math.random(); }

/* ============ "FINE GIORNATA" PERSONALIZZATA ============
   Se l'utente va a letto alle 3, la mezzanotte non è un confine di giornata
   utile. Tutto ciò che riguarda "quale giorno è" (streak, grafico, periodo
   giornaliero) viene calcolato spostando l'orologio indietro di dayStartHour
   ore prima di leggere anno/mese/giorno. */
function dayShiftMs(){ return state.dayStartHour * 3600000; }
function shifted(d){ return new Date(d.getTime() - dayShiftMs()); }

function localDateKey(d=new Date()){
  const sd = shifted(d);
  const y=sd.getFullYear(), m=String(sd.getMonth()+1).padStart(2,'0'), day=String(sd.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function setDayStartHour(h){
  state.dayStartHour = h;
  localStorage.setItem('ab_day_start_hour', String(h));
  render();
}

function fmtAgo(dateStr){
  if(!dateStr) return 'mai fatto';
  const diff = Date.now() - new Date(dateStr).getTime();
  const min = Math.floor(diff/60000), h=Math.floor(diff/3600000), d=Math.floor(diff/86400000);
  if(diff < 60000) return 'poco fa';
  if(min < 60) return `${min} min fa`;
  if(h < 24) return `${h} or${h===1?'a':'e'} fa`;
  if(d < 30) return `${d} giorn${d===1?'o':'i'} fa`;
  const months = Math.floor(d/30);
  if(months < 12) return `${months} mes${months===1?'e':'i'} fa`;
  return `${Math.floor(months/12)} ann${Math.floor(months/12)===1?'o':'i'} fa`;
}

function fmtDateTime(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}

/* ============ PERIODI DI CALENDARIO (rispettano dayStartHour) ============ */
function periodStart(periodo, ref=new Date()){
  const d = shifted(ref);
  if(periodo==='giorno'){ d.setHours(0,0,0,0); }
  else if(periodo==='settimana'){ const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); }
  else if(periodo==='mese'){ d.setDate(1); d.setHours(0,0,0,0); }
  else if(periodo==='anno'){ d.setMonth(0,1); d.setHours(0,0,0,0); }
  return new Date(d.getTime() + dayShiftMs());
}
function periodEnd(periodo, start){
  const d = new Date(start);
  if(periodo==='giorno') d.setDate(d.getDate()+1);
  else if(periodo==='settimana') d.setDate(d.getDate()+7);
  else if(periodo==='mese') d.setMonth(d.getMonth()+1);
  else if(periodo==='anno') d.setFullYear(d.getFullYear()+1);
  return d;
}

/* Per tipo 'checkbox' conta le occorrenze; per 'quantita' somma i valori registrati. */
function countInPeriod(h, periodo){
  const l = state.logs[h.id] || [];
  const start = periodStart(periodo).getTime();
  const inRange = l.filter(x=> new Date(x.fatto_at).getTime() >= start);
  if(h.tipo==='quantita') return inRange.reduce((s,x)=> s + (Number(x.valore)||0), 0);
  return inRange.length;
}

function isDueToday(h){
  const done = countInPeriod(h, h.target_periodo);
  if(h.target_periodo==='giorno') return done < h.target_volte;
  const start = periodStart(h.target_periodo);
  const end = periodEnd(h.target_periodo, start);
  const elapsedFrac = (Date.now()-start.getTime())/(end.getTime()-start.getTime());
  const expected = h.tipo==='quantita' ? h.target_volte*elapsedFrac : Math.ceil(h.target_volte*elapsedFrac);
  return done < expected;
}

function habitStatus(h){
  const done = countInPeriod(h, h.target_periodo);
  const ratio = done / h.target_volte;
  if(ratio >= 1) return 'ok';
  return isDueToday(h) ? 'warn' : 'danger';
}

function fmtAmount(h, n){
  const num = h.tipo==='quantita' ? (Math.round(n*100)/100) : n;
  return h.tipo==='quantita' ? `${num}${h.unita ? ' '+esc(h.unita) : ''}` : `${num}`;
}

/* ============ STREAK (calcolata solo dai log già presenti) ============ */
function computeStreak(h){
  const logs = state.logs[h.id] || [];
  if(!logs.length) return 0;
  let daysOk;
  if(h.tipo==='quantita'){
    const perDay = {};
    logs.forEach(l=>{ const k=localDateKey(new Date(l.fatto_at)); perDay[k]=(perDay[k]||0)+(Number(l.valore)||0); });
    daysOk = new Set(Object.keys(perDay).filter(k=> perDay[k] >= h.target_volte));
  } else {
    daysOk = new Set(logs.map(l=> localDateKey(new Date(l.fatto_at))));
  }
  let streak = 0;
  let cursor = new Date();
  if(!daysOk.has(localDateKey(cursor))) cursor.setDate(cursor.getDate()-1);
  while(daysOk.has(localDateKey(cursor))){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}

/* ============ AUTENTICAZIONE (email + password, come CaliMat/PesoDigiuno) ============ */
let authMode = 'login';

function renderAuthScreen(){
  document.querySelector('.app-shell').style.display = 'none';
  document.getElementById('userChip').style.visibility = 'hidden';
  document.querySelector('.fab').style.display = 'none';
  document.querySelector('.tabbar').style.display = 'none';
  document.getElementById('authGate').innerHTML = `
    <div class="auth-screen">
      <h2>${authMode==='login' ? 'Accedi' : 'Crea account'}</h2>
      <div class="small" style="margin-bottom:18px;">Abitudini</div>
      <div class="card">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="tuo@email.it" autocomplete="username">
        <label>Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" autocomplete="${authMode==='login'?'current-password':'new-password'}">
        <div class="modal-actions">
          <button class="btn" style="flex:1" onclick="${authMode==='login'?'doLogin()':'doSignup()'}">${authMode==='login'?'Accedi':'Registrati'}</button>
        </div>
        <div id="auth-msg" class="small" style="margin-top:10px;"></div>
        <div class="row" style="justify-content:space-between; margin-top:14px;">
          <span class="small" style="cursor:pointer; text-decoration:underline;" onclick="toggleAuthMode()">${authMode==='login'?'Non hai un account? Registrati':'Hai già un account? Accedi'}</span>
        </div>
        ${authMode==='login' ? `<div class="small" style="cursor:pointer; text-decoration:underline; margin-top:8px;" onclick="sendPasswordReset()">Password dimenticata?</div>` : ''}
      </div>
    </div>`;
}
function toggleAuthMode(){ authMode = authMode==='login' ? 'signup' : 'login'; renderAuthScreen(); }

async function doLogin(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const msgEl = document.getElementById('auth-msg');
  if(!email || !password){ msgEl.textContent = 'Inserisci email e password.'; return; }
  msgEl.textContent = 'Accesso in corso...';
  try{
    const {error} = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
  }catch(err){
    msgEl.textContent = 'Errore: ' + (err.message === 'Invalid login credentials' ? 'email o password errati.' : err.message);
  }
}
async function doSignup(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const msgEl = document.getElementById('auth-msg');
  if(!email || !password){ msgEl.textContent = 'Inserisci email e password.'; return; }
  if(password.length < 6){ msgEl.textContent = 'La password deve avere almeno 6 caratteri.'; return; }
  msgEl.textContent = 'Creazione account...';
  try{
    const {data, error} = await sb.auth.signUp({ email, password });
    if(error) throw error;
    if(!data.session){ msgEl.textContent = 'Account creato! Controlla la tua email per confermare, poi accedi.'; authMode='login'; }
  }catch(err){ msgEl.textContent = 'Errore: ' + err.message; }
}
async function sendPasswordReset(){
  const email = document.getElementById('auth-email').value.trim();
  const msgEl = document.getElementById('auth-msg');
  if(!email){ msgEl.textContent = 'Inserisci la tua email qui sopra, poi tocca di nuovo "Password dimenticata".'; return; }
  msgEl.textContent = 'Invio in corso...';
  try{
    const {error} = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
    if(error) throw error;
    msgEl.textContent = 'Email di reset inviata, controlla la posta.';
  }catch(err){ msgEl.textContent = 'Errore: ' + err.message; }
}
async function logout(){
  await sb.auth.signOut();
  state.habits = []; state.logs = {};
  closeModal();
}
function showApp(){
  document.getElementById('authGate').innerHTML = '';
  document.querySelector('.app-shell').style.display = 'block';
  document.getElementById('userChip').style.visibility = 'visible';
  document.querySelector('.fab').style.display = 'flex';
  document.querySelector('.tabbar').style.display = 'flex';
  document.getElementById('userEmail').textContent = state.session?.user?.email || '';
}
sb.auth.onAuthStateChange((event, session)=>{
  state.session = session;
  if(session){ showApp(); loadAll().then(()=> checkDailyReminder(false)); }
  else{ renderAuthScreen(); }
});

/* ============ MENU (impostazioni, notifiche, esporta/importa, logout) ============ */
function openMenu(){
  const email = state.session?.user?.email || '';
  showModal(`
    <h2>Menu</h2>

/* ============ ESPORTA / IMPORTA (CSV) ============ */
function exportCSV(){
  const rows = [];
  state.habits.forEach(h=> rows.push({
    tipo_record:'abitudine', id:h.id, habit_id:'', nome:h.nome, tipo:h.tipo||'checkbox',
    target_volte:h.target_volte, target_periodo:h.target_periodo, unita:h.unita||'', ordine:h.ordine||0,
    fatto_at:'', valore:'', nota:''
  }));
  Object.values(state.logs).flat().forEach(l=> rows.push({
    tipo_record:'log', id:l.id, habit_id:l.habit_id, nome:'', tipo:'', target_volte:'', target_periodo:'',
    unita:'', ordine:'', fatto_at:l.fatto_at, valore:l.valore ?? '', nota:l.nota || ''
  }));
  const csv = Papa.unparse(rows);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `abitudini-backup-${localDateKey()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function triggerImport(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv,text/csv';
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, { header:true, skipEmptyLines:true, complete:(res)=>{
      const habitsRows = res.data.filter(r=> r.tipo_record==='abitudine');
      const logRows = res.data.filter(r=> r.tipo_record==='log');
      if(!habitsRows.length && !logRows.length){ alert('File CSV non riconosciuto: mancano le colonne attese.'); return; }
      confirmImport(habitsRows, logRows);
    }, error:(err)=> alert('Errore lettura CSV: '+err.message) });
  };
  input.click();
}

function confirmImport(habitsRows, logRows){
  showModal(`
    <h2>Importare il backup?</h2>
    <div class="small">Trovate ${habitsRows.length} abitudini e ${logRows.length} registrazioni.
    Verranno aggiunte come nuove voci (non sovrascrivono quelle esistenti).</div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Annulla</button>
      <button class="btn" onclick="doImport()">Importa</button>
    </div>
  `, true);
  window._pendingImport = {habitsRows, logRows};
}

async function doImport(){
  const {habitsRows, logRows} = window._pendingImport || {habitsRows:[],logRows:[]};
  closeModal();
  const idMap = {};
  let maxOrdine = state.habits.reduce((m,h)=> Math.max(m, h.ordine||0), 0);
  for(const r of habitsRows){
    const newId = uid();
    idMap[r.id] = newId;
    maxOrdine++;
    const entry = {
      id:newId, nome:r.nome, tipo:r.tipo||'checkbox', unita:r.unita||null,
      target_volte:parseFloat(r.target_volte)||1, target_periodo:r.target_periodo||'giorno',
      ordine:maxOrdine, archiviata:false
    };
    state.habits.push({...entry, created_at:new Date().toISOString()});
    state.logs[newId] = [];
    try{ await sb.from('abit_abitudini').insert(entry); }
    catch(err){ queuePending('insert_habit', entry); }
  }
  for(const r of logRows){
    const habitId = idMap[r.habit_id];
    if(!habitId) continue;
    const entry = {id: uid(), habit_id: habitId, fatto_at: r.fatto_at, valore: r.valore? parseFloat(r.valore) : null, nota: r.nota || null};
    state.logs[habitId].push(entry);
    try{ await sb.from('abit_abitudini_log').insert(entry); }
    catch(err){ queuePending('insert_log', entry); }
  }
  Object.values(state.logs).forEach(arr=> arr.sort((a,b)=> new Date(b.fatto_at)-new Date(a.fatto_at)));
  render();
  alert('Importazione completata.');
}

/* ============ DATA LOAD ============ */
async function loadAll(){
  try{
    const {data: habits, error:e1} = await sb.from('abit_abitudini').select('*').eq('archiviata', false)
      .order('ordine',{ascending:true}).order('created_at',{ascending:true});
    if(e1) throw e1;
    state.habits = habits || [];
    // fix: se l'ordine è duplicato/azzerato (es. dopo un caricamento manuale in DB), lo normalizziamo una volta
    const ordini = state.habits.map(h=>h.ordine||0);
    const hasDup = new Set(ordini).size < ordini.length;
    if(hasDup && state.habits.length){
      state.habits.forEach((h,i)=>{ h.ordine = i; });
      persistOrdineBulk(state.habits);
    }
    const {data: logs, error:e2} = await sb.from('abit_abitudini_log').select('*').order('fatto_at',{ascending:false});
    if(e2) throw e2;
    state.logs = {};
    (logs||[]).forEach(l=>{ (state.logs[l.habit_id] = state.logs[l.habit_id] || []).push(l); });
    setConn(true);
  }catch(err){ console.error(err); setConn(false); }
  render();
}
async function persistOrdineBulk(habits){
  for(const h of habits){
    try{ await sb.from('abit_abitudini').update({ordine:h.ordine}).eq('id', h.id); }
    catch(err){ queuePending('update_habit', {id:h.id, ordine:h.ordine}); }
  }
}

function setConn(ok){

function pluralWord(n, sing, plur){ return n===1 ? sing : plur; }

function renderOggi(){
  if(!state.habits.length) return emptyState();

  html += `<div class="reminder-banner"><h3>📋 Da fare oggi</h3>`;
  if(!due.length){
    html += `<div class="reminder-item"><span class="small">Tutto fatto per oggi 🎉</span></div>`;
  } else {
    due.forEach(h=>{
      const done = countInPeriod(h, h.target_periodo);
      const periodoLbl = h.target_periodo==='giorno' ? '' : ` <span class="small">(${PERIOD_LABEL[h.target_periodo]})</span>`;
      const progressTxt = h.tipo==='quantita' ? `${fmtAmount(h,done)}/${fmtAmount(h,h.target_volte)}` : `${done}/${h.target_volte}`;
      html += `<div class="reminder-item">
        <span>${esc(h.nome)}${periodoLbl} <span class="small">${progressTxt}</span></span>
        <button class="btn small" onclick="${h.tipo==='quantita'?`openQuickQty('${h.id}')`:`quickLog('${h.id}')`}">${h.tipo==='quantita'?'Registra':'Fatto ✓'}</button>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

function motivationCard(){
  let bestStreak = 0, bestName = '';
  state.habits.forEach(h=>{
    const s = computeStreak(h);
    if(s > bestStreak){ bestStreak = s; bestName = h.nome; }
  });
  const now = new Date();
  const weekStart = periodStart('settimana', now).getTime();
  const prevWeekStart = weekStart - 7*86400000;
  let thisWeek = 0, lastWeek = 0;
  Object.values(state.logs).forEach(arr=> arr.forEach(l=>{
    const t = new Date(l.fatto_at).getTime();
    if(t >= weekStart) thisWeek++;
    else if(t >= prevWeekStart && t < weekStart) lastWeek++;
  }));

  // Mostriamo la card solo quando c'è qualcosa di genuinamente incoraggiante da dire.
  // Uno streak di 1 giorno o "1 attività" non motivano nessuno: meglio tacere che essere fiacchi.
  if(bestStreak < 2 && thisWeek < 2) return '';

  let lines = [];
  if(bestStreak >= 2){
    lines.push(`🔥 ${bestStreak} giorni di fila su "${esc(bestName)}"`);
  }
  if(lastWeek > 0 && thisWeek !== lastWeek){
    const verbo = thisWeek > lastWeek ? 'meglio' : 'un po\' più piano';
    lines.push(`Questa settimana stai andando ${verbo} della precedente (${thisWeek} vs ${lastWeek} attività)`);
  } else if(thisWeek >= 2){
    lines.push(`${thisWeek} ${pluralWord(thisWeek,'attività registrata','attività registrate')} questa settimana`);
  }
  if(!lines.length) return '';
  return `<div class="motivation-card"><h3>${lines[0]}</h3>${lines[1]?`<div class="small">${lines[1]}</div>`:''}</div>`;
}

  const progressTxt = h.tipo==='quantita' ? `${fmtAmount(h,done)}/${fmtAmount(h,h.target_volte)}` : `${done}/${h.target_volte}`;
  const freqTxt = h.tipo==='quantita'
    ? `${fmtAmount(h,h.target_volte)} al ${PERIOD_LABEL[h.target_periodo]}`
    : `${h.target_volte}× al ${PERIOD_LABEL[h.target_periodo]}`;
  return `<div class="card habit-card" data-id="${h.id}" ${draggable?'draggable="true"':''}>
    <div class="habit-top">
      ${draggable?`<div class="grip"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.6"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg></div>`:''}

        <div class="habit-name">${esc(h.nome)}</div>
        <div class="habit-freq">${freqTxt}</div>
      </div>
      <div class="row" style="align-items:flex-start; gap:6px;">
        ${streak>1 ? `<span class="chip streak">🔥 ${streak}g</span>` : ''}
        <span class="chip ${status}">${progressTxt}</span>
        <button class="kebab" onclick="openHabitMenu('${h.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="row" style="justify-content:space-between; align-items:center;">
      <span class="small">Ultima: ${fmtAgo(last?.fatto_at)}</span>
      <div class="row">
        ${h.tipo==='quantita'
          ? `<button class="btn small" onclick="openQuickQty('${h.id}')">＋ registra</button>`
          : `<button class="btn small secondary" onclick="openManualLog('${h.id}')">＋ manuale</button>
             <button class="btn small" onclick="quickLog('${h.id}')">Fatto ✓</button>`}
      </div>

}

function sortedHabits(){
  const arr = [...state.habits];
  if(state.sortMode==='alfabetico') arr.sort((a,b)=> a.nome.localeCompare(b.nome,'it'));
  else if(state.sortMode==='frequenza'){
    const rank = {giorno:0, settimana:1, mese:2, anno:3};
    arr.sort((a,b)=> (rank[a.target_periodo]-rank[b.target_periodo]) || (b.target_volte-a.target_volte));
  } else {
    arr.sort((a,b)=> (a.ordine||0)-(b.ordine||0));
  }
  return arr;
}
function setSortMode(mode){ state.sortMode = mode; localStorage.setItem('ab_sort', mode); render(); }

/* TAB "ABITUDINI": elenco completo, ordinamento, drag & drop in modalità personale */
function renderAbitudini(){
  if(!state.habits.length) return emptyState();
  const modes = [['personale','Personale'],['alfabetico','Alfabetico'],['frequenza','Frequenza']];
  let html = `<div class="sort-row">${modes.map(([k,l])=>
    `<button class="sort-btn ${state.sortMode===k?'active':''}" onclick="setSortMode('${k}')">${l}</button>`
  ).join('')}</div>`;
  const draggable = state.sortMode==='personale';
  if(draggable) html += `<div class="small" style="margin-bottom:8px;">Trascina l'icona ⠿ per riordinare.</div>`;
  html += `<div id="habitList">` + sortedHabits().map(h=> habitCard(h, draggable)).join('') + `</div>`;
  return html;
}

let dragFromId = null;
function attachDragHandlers(){
  const list = document.getElementById('habitList');
  if(!list) return;
  list.querySelectorAll('.habit-card[draggable="true"]').forEach(card=>{
    card.addEventListener('dragstart', ()=>{ dragFromId = card.dataset.id; card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); });
    card.addEventListener('dragover', (e)=> e.preventDefault());
    card.addEventListener('drop', (e)=>{
      e.preventDefault();
      const toId = card.dataset.id;
      if(!dragFromId || dragFromId===toId) return;
      reorderHabits(dragFromId, toId);
    });
  });
}
async function reorderHabits(fromId, toId){
  const list = sortedHabits();
  const fromIdx = list.findIndex(h=>h.id===fromId);
  const toIdx = list.findIndex(h=>h.id===toId);
  if(fromIdx===-1 || toIdx===-1) return;
  const [moved] = list.splice(fromIdx,1);
  list.splice(toIdx,0,moved);
  list.forEach((h,i)=> h.ordine = i);
  render();
  await persistOrdineBulk(list);
}

function renderChart(h){
  const days = [];
  for(let i=13;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const logs = state.logs[h.id] || [];
  const counts = days.map(d=>{
    const key = localDateKey(d);
    const dayLogs = logs.filter(l=> localDateKey(new Date(l.fatto_at))===key);
    return h.tipo==='quantita' ? dayLogs.reduce((s,l)=> s+(Number(l.valore)||0),0) : dayLogs.length;
  });
  const max = Math.max(1, ...counts);
  const bars = days.map((d,i)=>{
    const c = counts[i];
    const heightPct = c===0 ? 3 : Math.max(10, Math.round(c/max*100));
    return `<div class="bar-col">
      <div class="bar ${c>0?'hit':''}" style="height:${heightPct}%"></div>
      <div class="bar-label">${d.getDate()}/${d.getMonth()+1}</div>
    </div>`;
  }).join('');
  return `<div class="chart-wrap"><div class="bars">${bars}</div></div>`;
}

/* TAB "STORICO": solo elenco cronologico grezzo dei log */

async function quickLog(habitId){

    const {error} = await sb.from('abit_abitudini_log').insert({id:entry.id, habit_id:habitId, fatto_at:entry.fatto_at});

    setConn(true);

async function saveQuickQty(habitId){
  const val = parseFloat(document.getElementById('qty-value').value);
  if(isNaN(val) || val<0){ alert('Inserisci un valore valido.'); return; }
  const entry = {id: uid(), habit_id: habitId, fatto_at: new Date().toISOString(), valore: val, nota:null};
  state.logs[habitId] = state.logs[habitId] || [];
  state.logs[habitId].unshift(entry);
  closeModal(); render();
  try{
    const {error} = await sb.from('abit_abitudini_log').insert(entry);
    if(error) throw error;
  }catch(err){ queuePending('insert_log', entry); setConn(false); }
}

function openManualLog(habitId){
  const h = state.habits.find(x=>x.id===habitId);
  const now = new Date();
  const dateVal = localDateKey(now);
  const timeVal = now.toTimeString().slice(0,5);
  showModal(`
    <h2>Registra manualmente</h2>
    <div class="small">${esc(h.nome)}</div>
    <label>Data</label>
    <input type="date" id="ml-date" value="${dateVal}">
    <label>Ora</label>
    <input type="time" id="ml-time" value="${timeVal}">
    ${h.tipo==='quantita' ? `<label>Quantità${h.unita?` (${esc(h.unita)})`:''}</label><input type="number" id="ml-valore" step="0.01" min="0">` : ''}
    <label>Nota (opzionale)</label>
    <input type="text" id="ml-nota" placeholder="es. dopo cena">
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Annulla</button>
      <button class="btn" onclick="saveManualLog('${habitId}')">Salva</button>
    </div>
  `);
}
async function saveManualLog(habitId){
  const h = state.habits.find(x=>x.id===habitId);
  const date = document.getElementById('ml-date').value;
  const time = document.getElementById('ml-time').value || '00:00';
  const nota = document.getElementById('ml-nota').value.trim();
  const valEl = document.getElementById('ml-valore');
  const valore = valEl ? parseFloat(valEl.value) : null;
  const fatto_at = new Date(`${date}T${time}:00`).toISOString();
  const entry = {id: uid(), habit_id: habitId, fatto_at, valore: isNaN(valore)?null:valore, nota: nota || null};
  state.logs[habitId] = state.logs[habitId] || [];
  state.logs[habitId].push(entry);
  state.logs[habitId].sort((a,b)=> new Date(b.fatto_at)-new Date(a.fatto_at));
  closeModal(); render();
  try{
    const {error} = await sb.from('abit_abitudini_log').insert(entry);
    if(error) throw error;
  }catch(err){ queuePending('insert_log', entry); setConn(false); }
}

function deleteLog(logId, habitId){
  const arr = state.logs[habitId] || [];
  const idx = arr.findIndex(l=>l.id===logId);
  if(idx===-1) return;
  const removed = arr.splice(idx,1)[0];
  render();
  showUndoToast('Registrazione eliminata', ()=>{ arr.splice(idx,0,removed); render(); }, async ()=>{
    try{ await sb.from('abit_abitudini_log').delete().eq('id', logId); }
    catch(err){ queuePending('delete_log', {id:logId}); }
  });
}
function deleteHabit(habitId){
  const idx = state.habits.findIndex(h=>h.id===habitId);
  if(idx===-1) return;
  const removed = state.habits.splice(idx,1)[0];
  const removedLogs = state.logs[habitId];
  delete state.logs[habitId];
  render();
  showUndoToast(`"${removed.nome}" eliminata`, ()=>{
    state.habits.splice(idx,0,removed);
    if(removedLogs) state.logs[habitId] = removedLogs;
    render();
  }, async ()=>{
    try{ await sb.from('abit_abitudini').delete().eq('id', habitId); }
    catch(err){ queuePending('delete_habit', {id:habitId}); }
  });
}

function toggleQtyFields(){
  const tipo = document.getElementById('h-tipo').value;
  document.getElementById('qty-fields').style.display = tipo==='quantita' ? 'block' : 'none';
  document.getElementById('h-volte-unit-label').textContent = tipo==='quantita' ? 'al' : 'volte al';
}

function openHabitModal(habitId){
  const h = habitId ? state.habits.find(x=>x.id===habitId) : null;
  const tipo = h?.tipo || 'checkbox';
  showModal(`
    <h2>${h?'Modifica abitudine':'Nuova abitudine'}</h2>
    <label>Nome</label>
    <input type="text" id="h-nome" value="${h?esc(h.nome):''}" placeholder="es. Studiare fagotto">
    <label>Tipo</label>
    <select id="h-tipo" onchange="toggleQtyFields()">
      <option value="checkbox" ${tipo==='checkbox'?'selected':''}>Fatto / non fatto</option>
      <option value="quantita" ${tipo==='quantita'?'selected':''}>Quantità (es. km, litri, minuti...)</option>
    </select>
    <div id="qty-fields" style="display:${tipo==='quantita'?'block':'none'}">
      <label>Unità di misura</label>
      <input type="text" id="h-unita" value="${h?esc(h.unita||''):''}" placeholder="es. km, litri, minuti, kcal">
    </div>
    <label>Obiettivo</label>
    <div class="freq-row">
      <input type="number" id="h-volte" min="0.01" step="0.01" value="${h?h.target_volte:1}">
      <span class="small" id="h-volte-unit-label">${tipo==='quantita'?'al':'volte al'}</span>
      <select id="h-periodo">
        ${Object.keys(PERIOD_LABEL).map(p=>`<option value="${p}" ${h&&h.target_periodo===p?'selected':''}>${PERIOD_LABEL[p]}</option>`).join('')}
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Annulla</button>
      <button class="btn" onclick="saveHabit(${h?`'${h.id}'`:'null'})">Salva</button>
    </div>
  `, true);
}
async function saveHabit(habitId){
  const nome = document.getElementById('h-nome').value.trim();
  const tipo = document.getElementById('h-tipo').value;
  const unita = tipo==='quantita' ? document.getElementById('h-unita').value.trim() : null;
  const volte = parseFloat(document.getElementById('h-volte').value) || 1;
  const periodo = document.getElementById('h-periodo').value;
  if(!nome){ alert('Inserisci un nome'); return; }
  closeModal();
  if(habitId){
    const h = state.habits.find(x=>x.id===habitId);
    h.nome = nome; h.tipo = tipo; h.unita = unita; h.target_volte = volte; h.target_periodo = periodo;
    render();
    try{ await sb.from('abit_abitudini').update({nome, tipo, unita, target_volte:volte, target_periodo:periodo}).eq('id', habitId); }
    catch(err){ queuePending('update_habit', {id:habitId, nome, tipo, unita, target_volte:volte, target_periodo:periodo}); }
  } else {
    const maxOrdine = state.habits.reduce((m,h)=> Math.max(m, h.ordine||0), 0);
    const entry = {id: uid(), nome, tipo, unita, target_volte:volte, target_periodo:periodo, ordine:maxOrdine+1, archiviata:false, created_at:new Date().toISOString()};
    state.habits.push(entry);
    state.logs[entry.id] = [];
    render();
    try{ await sb.from('abit_abitudini').insert({id:entry.id, nome, tipo, unita, target_volte:volte, target_periodo:periodo, ordine:entry.ordine}); }
    catch(err){ queuePending('insert_habit', entry); }
  }
}

function showHistory(habitId){
  const h = state.habits.find(x=>x.id===habitId);
  const logs = state.logs[habitId] || [];
  showModal(`
    <h2>Storico — ${esc(h.nome)}</h2>
    ${logs.length ? logs.map(l=>`
      <div class="history-item">
        <div class="small">${fmtDateTime(l.fatto_at)}${h.tipo==='quantita'&&l.valore!=null?` — ${l.valore}${h.unita?' '+esc(h.unita):''}`:''}${l.nota?' · '+esc(l.nota):''}</div>
        <button class="del" onclick="deleteLog('${l.id}','${habitId}'); showHistory('${habitId}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>`).join('') : '<div class="small">Nessuna registrazione.</div>'}
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Chiudi</button></div>
  `);
}

/* ============ MODAL / TOAST ============ */
function showModal(html, center){
  let bg = document.getElementById('modalBg');
  if(bg) bg.remove();
  bg = document.createElement('div');
  bg.id = 'modalBg';
  bg.className = 'modal-bg' + (center ? ' center' : '');
  bg.onclick = (e)=>{ if(e.target===bg) closeModal(); };
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){ const bg = document.getElementById('modalBg'); if(bg) bg.remove(); }

let toastTimer = null;
function showUndoToast(msg, onUndo, onConfirm){
  const old = document.getElementById('undoToast');
  if(old){ old.remove(); if(old._confirm) old._confirm(); }
  const t = document.createElement('div');
  t.id = 'undoToast';
  t.className = 'toast';
  t.innerHTML = `<span>${msg}</span><button id="undoBtn">Annulla</button>`;
  document.body.appendChild(t);
  let undone = false;
  t._confirm = ()=>{ if(!undone) onConfirm(); };
  t.querySelector('#undoBtn').onclick = ()=>{
    undone = true; clearTimeout(toastTimer); t.remove(); onUndo();
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ if(!undone){ onConfirm(); } t.remove(); }, 5000);
}

/* ============ OFFLINE QUEUE ============ */
function queuePending(action, data){
  const q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
  q.push({action, data, ts: Date.now()});
  localStorage.setItem(PENDING_KEY, JSON.stringify(q));
}
async function flushPending(){
  const q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
  if(!q.length) return;
  const remaining = [];
  for(const item of q){
    try{
      if(item.action==='insert_habit') await sb.from('abit_abitudini').insert(item.data);
      else if(item.action==='update_habit'){ const {id, ...rest} = item.data; await sb.from('abit_abitudini').update(rest).eq('id', id); }
      else if(item.action==='delete_habit') await sb.from('abit_abitudini').delete().eq('id', item.data.id);
      else if(item.action==='insert_log') await sb.from('abit_abitudini_log').insert(item.data);
      else if(item.action==='delete_log') await sb.from('abit_abitudini_log').delete().eq('id', item.data.id);
    }catch(err){ remaining.push(item); }
  }
  localStorage.setItem(PENDING_KEY, JSON.stringify(remaining));
}
window.addEventListener('online', async ()=>{ setConn(true); await flushPending(); await loadAll(); });
window.addEventListener('offline', ()=> setConn(false));

/* ============ NOTIFICHE ============
   Limite onesto: funzionano solo quando l'app è aperta (nessun backend Web
   Push), quindi sono un promemoria "all'apertura", non una vera notifica
   che arriva ad app chiusa. */
async function requestNotifPermission(){
  if(!('Notification' in window)){ alert('Notifiche non supportate su questo dispositivo.'); return; }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){
    alert('Promemoria attivato: quando apri l\'app, se ci sono abitudini da fare riceverai una notifica. Non arriva se l\'app è chiusa.');
    checkDailyReminder(true);
  }
}
function checkDailyReminder(force){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const lastCheck = localStorage.getItem('ab_last_reminder');
  const today = localDateKey();
  if(!force && lastCheck===today) return;
  const due = state.habits.filter(isDueToday);
  if(due.length){ new Notification('Abitudini di oggi', { body: due.map(h=>h.nome).join(', ') }); }
  localStorage.setItem('ab_last_reminder', today);
}

/* ============ SERVICE WORKER (offline shell) ============ */
if('serviceWorker' in navigator){
  const swCode = `
    self.addEventListener('install', e=>self.skipWaiting());
    self.addEventListener('activate', e=>self.clients.claim());
    self.addEventListener('fetch', e=>{});
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

/* ============ INIT ============
   L'avvio è gestito da onAuthStateChange sopra. */
setInterval(()=>{ render(); }, 60000);
